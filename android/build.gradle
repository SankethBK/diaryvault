allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // Flutter 3.32 / AGP 8 require every Android module to declare a `namespace`.
    // Several transitive plugins pinned in pub-cache (flutter_inappwebview via
    // youtube_player_flutter, flutter_sound, qr_code_scanner, ...) predate this
    // and only set the legacy `package` attribute in their AndroidManifest.xml.
    // Derive the namespace from that package for any subproject that lacks one,
    // so they build under AGP 8 without editing pub-cache (which `pub get`
    // overwrites). Registered before evaluationDependsOn so the hook is attached
    // while the subproject is still being configured.
    afterEvaluate { project ->
        def android = project.extensions.findByName('android')
        if (android != null && android.namespace == null) {
            def manifest = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                def pkg = new groovy.util.XmlSlurper().parse(manifest).@package.text()
                if (pkg) {
                    android.namespace = pkg
                }
            }
        }
    }
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
