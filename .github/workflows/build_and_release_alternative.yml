name: Build and Release APKs (Alternative)

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build from'
        required: false
        type: string
      create_release:
        description: 'Create a new release if one does not exist'
        required: false
        type: boolean
        default: false

env:
  # Keep FLUTTER_VERSION in sync with .fvmrc.
  # JAVA_VERSION must be 17+: the Android build uses AGP 8.7.3 / Gradle 8.12.
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  build-and-release:
    # Only auto-build releases that were created from the foss_master branch.
    # Manual workflow_dispatch runs are always allowed for testing.
    if: github.event_name == 'workflow_dispatch' || github.event.release.target_commitish == 'foss_master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # `secrets` is NOT an available context inside a step-level `if:`
    # (see GitHub's context-availability table), so the signing secrets are
    # surfaced as job env vars and the steps below branch on those instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
          echo "Current directory: $(pwd)"
          echo "Contents: $(ls -la)"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
            **/.dart_tool
          key: flutter-${{ hashFiles('**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: |
            flutter-${{ hashFiles('**/pubspec.lock') }}
            flutter-

      - name: Install dependencies
        run: |
          echo "Installing dependencies for local packages first..."
          
          # Install dependencies for local packages
          for package_dir in packages/*/; do
            if [ -f "$package_dir/pubspec.yaml" ]; then
              echo "Installing dependencies for $package_dir"
              cd "$package_dir"
              flutter pub get
              cd ../..
            fi
          done
          
          echo "Installing main project dependencies..."
          flutter pub get

      # Install the exact NDK the app pins. AGP strips debug symbols from the
      # prebuilt .so files with llvm-strip, so the NDK must be present even
      # though nothing here compiles native code. Version is read from
      # build.gradle so the two can't drift apart.
      # build-tools 35.0.0 matches compileSdkVersion 35 in build.gradle.
      - name: Install pinned NDK and build-tools
        run: |
          NDK_VERSION=$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle)
          if [ -z "$NDK_VERSION" ]; then
            echo "could not parse ndkVersion from android/app/build.gradle" >&2
            exit 1
          fi
          echo "Installing ndk;$NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "build-tools;35.0.0"

      # Setup keystore only if ALL secrets are set, to avoid errors
      - name: Setup keystore
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build APKs
        run: |
          if [ -f "android/key.properties" ]; then
            echo "Building signed release APKs"
            flutter build apk --split-per-abi --release
            BUILD_TYPE="release"
          else
            echo "Building debug APKs (no keystore configured)"
            flutter build apk --split-per-abi --debug
            BUILD_TYPE="debug"
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV

      - name: Verify 16 KB page alignment
        if: env.BUILD_TYPE == 'release'
        shell: bash
        run: |
          set -euo pipefail
          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          readelf_bin="$(command -v llvm-readelf || command -v readelf)"

          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$zipalign" -c -P 16 4 "$apk"
            while IFS= read -r lib; do
              tmp_lib="$(mktemp)"
              unzip -p "$apk" "$lib" > "$tmp_lib"
              while IFS= read -r alignment; do
                if (( alignment < 0x4000 )); then
                  echo "$apk: $lib has ELF LOAD alignment $alignment" >&2
                  exit 1
                fi
              done < <("$readelf_bin" -lW "$tmp_lib" | awk '$1 == "LOAD" { print $NF }')
              rm -f "$tmp_lib"
            done < <(unzip -Z1 "$apk" | grep '\.so$')
          done

      - name: Prepare APK names
        id: apk_names
        run: |
          TAG_NAME="${{ github.event.release.tag_name || inputs.tag_name || 'latest' }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "arm64_name=diaryvault-arm64-v8a-$TAG_NAME.apk" >> $GITHUB_OUTPUT
          echo "armv7_name=diaryvault-armeabi-v7a-$TAG_NAME.apk" >> $GITHUB_OUTPUT
          echo "x86_name=diaryvault-x86_64-$TAG_NAME.apk" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-${{ env.BUILD_TYPE }}.apk ${{ steps.apk_names.outputs.arm64_name }}
          mv app-armeabi-v7a-${{ env.BUILD_TYPE }}.apk ${{ steps.apk_names.outputs.armv7_name }}
          mv app-x86_64-${{ env.BUILD_TYPE }}.apk ${{ steps.apk_names.outputs.x86_name }}
          ls -la

      - name: Create release if needed
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Creating release for tag $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes "Automated release for tag $TAG_NAME" \
              --draft=false \
              --prerelease=false
          else
            echo "Release $TAG_NAME already exists"
          fi

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.apk_names.outputs.tag_name }}"
          cd build/app/outputs/flutter-apk/
          
          echo "Uploading APKs to release $TAG_NAME"
          gh release upload "$TAG_NAME" \
            ${{ steps.apk_names.outputs.arm64_name }} \
            ${{ steps.apk_names.outputs.armv7_name }} \
            ${{ steps.apk_names.outputs.x86_name }} \
            --clobber

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diaryvault-apks-${{ steps.apk_names.outputs.tag_name }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.apk_names.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs Built:**" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ steps.apk_names.outputs.arm64_name }}" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ steps.apk_names.outputs.armv7_name }}" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ steps.apk_names.outputs.x86_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "android/key.properties" ]; then
            echo "- **Signing:** ✅ Signed with keystore" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Signing:** ⚠️ Debug build (no keystore)" >> $GITHUB_STEP_SUMMARY
          fi
