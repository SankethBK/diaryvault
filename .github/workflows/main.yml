name: Deploy application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  render_document:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Set up flutter-action
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Get dependencies
        run: flutter pub get
      - name: Detect formatting errors
        run: dart format --line-length 80 --set-exit-if-changed --output none .
      # --no-fatal-infos: the Flutter 3.32 bump surfaced ~400 info-level
      # deprecation lints (withOpacity -> withValues, etc.) that are unrelated
      # to any change under review. Errors and warnings are still fatal.
      - name: Detect syntax errors
        run: flutter analyze --no-pub --no-fatal-infos .
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "build-tools;35.0.0"
      - name: Configure CI signing
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-signing.jks" -storepass changeit -keypass changeit -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI"
          cat > android/key.properties << EOF
          storePassword=changeit
          keyPassword=changeit
          keyAlias=ci
          storeFile=$RUNNER_TEMP/ci-signing.jks
          EOF
      - name: Build and verify 16 KB APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --split-per-abi --release
          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          readelf_bin="$(command -v llvm-readelf || command -v readelf)"

          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$zipalign" -c -P 16 4 "$apk"
            while IFS= read -r lib; do
              tmp_lib="$(mktemp)"
              unzip -p "$apk" "$lib" > "$tmp_lib"
              while IFS= read -r alignment; do
                if (( alignment < 0x4000 )); then
                  echo "$apk: $lib has ELF LOAD alignment $alignment" >&2
                  exit 1
                fi
              done < <("$readelf_bin" -lW "$tmp_lib" | awk '$1 == "LOAD" { print $NF }')
              rm -f "$tmp_lib"
            done < <(unzip -Z1 "$apk" | grep '\.so$')
          done
