name: Deploy application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  render_document:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Set up flutter-action
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Detect formatting errors
        run: dart format --line-length 80 --set-exit-if-changed --output none .
      # --no-fatal-infos: the Flutter 3.32 bump surfaced ~400 info-level
      # deprecation lints (withOpacity -> withValues, etc.) that are unrelated
      # to any change under review. Errors and warnings are still fatal.
      - name: Detect syntax errors
        run: flutter analyze --no-pub --no-fatal-infos .