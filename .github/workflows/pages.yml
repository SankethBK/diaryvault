name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'readme_assets/**'
      - 'assets/images/splash_icon_4.webp'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p site/images
          cp -r website/* site/
          cp readme_assets/* site/images/
          cp assets/images/splash_icon_4.webp site/icon.webp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
