name: Build and Attach APKs on Release

on:
  release:
    types: [created, published]
  workflow_dispatch: # Allows manual trigger
    inputs:
      tag_name:
        description: 'Tag name to build (optional, uses latest release if not provided)'
        required: false
        type: string

env:
  # Keep FLUTTER_VERSION in sync with .fvmrc.
  # JAVA_VERSION must be 17+: the Android build uses AGP 8.7.3 / Gradle 8.12.
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # `secrets` is NOT an available context inside a step-level `if:`
    # (see GitHub's context-availability table), so the signing secrets are
    # surfaced as job env vars and the steps below branch on those instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}


    steps:
      # Step 1: Check out the repository at the release's tag
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}

      # Step 2: Set up Java
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Step 3: Install Flutter
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Step 3.5: Verify Flutter installation
      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
          echo "Current directory: $(pwd)"
          echo "Contents: $(ls -la)"

      # Step 4: Cache dependencies
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
            **/.dart_tool
          key: flutter-${{ hashFiles('**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: |
            flutter-${{ hashFiles('**/pubspec.lock') }}
            flutter-

      # Step 5: Get Flutter dependencies
      - name: Get Flutter dependencies
        run: |
          echo "Installing dependencies for local packages first..."
          
          # Install dependencies for local packages
          for package_dir in packages/*/; do
            if [ -f "$package_dir/pubspec.yaml" ]; then
              echo "Installing dependencies for $package_dir"
              cd "$package_dir"
              flutter pub get
              cd ../..
            fi
          done
          
          echo "Installing main project dependencies..."
          flutter pub get

      # Step 5.5: Install the exact NDK the app pins. AGP strips debug symbols
      # from the prebuilt .so files with llvm-strip, so the NDK must be present
      # even though nothing here compiles native code. Version is read from
      # build.gradle so the two can't drift apart.
      # build-tools 35.0.0 matches compileSdkVersion 35 in build.gradle.
      - name: Install pinned NDK and build-tools
        run: |
          NDK_VERSION=$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle)
          if [ -z "$NDK_VERSION" ]; then
            echo "could not parse ndkVersion from android/app/build.gradle" >&2
            exit 1
          fi
          echo "Installing ndk;$NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "build-tools;35.0.0"

      # Step 6 & 7: Create keystore and key.properties if ALL signing secrets are present
      - name: Create keystore and key.properties
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      # Step 8: Build signed APKs. This workflow uploads release artifacts, so
      # do not silently substitute debug APKs when signing is unavailable.
      - name: Build APKs
        run: |
          if [ -f "android/key.properties" ]; then
            echo "Building signed APKs"
            flutter build apk --split-per-abi --release
          else
            echo "Signing configuration is missing; refusing to upload debug APKs as release artifacts" >&2
            exit 1
          fi

      # Step 9: List built APKs for debugging
      - name: List built APKs
        run: |
          ls -la build/app/outputs/flutter-apk/
          echo "APK files found:"
          find build/app/outputs/flutter-apk/ -name "*.apk" -type f

      # Step 10: Get release info
      - name: Get release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
            echo "release_id=${{ github.event.release.id }}" >> $GITHUB_OUTPUT
          else
            # For manual trigger, get the latest release
            release_info=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest")
            upload_url=$(echo "$release_info" | jq -r '.upload_url')
            release_id=$(echo "$release_info" | jq -r '.id')
            echo "upload_url=$upload_url" >> $GITHUB_OUTPUT
            echo "release_id=$release_id" >> $GITHUB_OUTPUT
          fi

      # Step 11: Upload arm64-v8a APK
      - name: Upload arm64-v8a APK
        if: steps.release_info.outputs.upload_url
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release_info.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          asset_name: diaryvault-arm64-v8a-${{ github.event.release.tag_name || inputs.tag_name || 'latest' }}.apk
          asset_content_type: application/vnd.android.package-archive

      # Step 11: Upload armeabi-v7a APK
      - name: Upload armeabi-v7a APK
        if: steps.release_info.outputs.upload_url
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release_info.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          asset_name: diaryvault-armeabi-v7a-${{ github.event.release.tag_name || inputs.tag_name || 'latest' }}.apk
          asset_content_type: application/vnd.android.package-archive

      # Step 11: Upload x86_64 APK
      - name: Upload x86_64 APK
        if: steps.release_info.outputs.upload_url
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release_info.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          asset_name: diaryvault-x86_64-${{ github.event.release.tag_name || inputs.tag_name || 'latest' }}.apk
          asset_content_type: application/vnd.android.package-archive

      # Step 12: Upload APKs as workflow artifacts (backup)
      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diaryvault-apks-${{ github.event.release.tag_name || inputs.tag_name || github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
