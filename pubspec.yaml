name: dairy_app
description: Diaryvault is a personal diary application equipped with a rich
  text editor, it has support for images, and videos as well. It also supports
  emojis from Google Keyboards.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.3.6+2030

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  audioplayers: ^5.2.1
  crypto: ^3.0.2
  cupertino_icons: ^1.0.2
  cryptography: ^2.9.0
  dartz: ^0.10.1
  delta_markdown:
    path: ./packages/delta_markdown
  equatable: ^2.0.3
  file_picker: ^8.0.4
  filesystem_picker: ^2.0.0-nullsafety.0
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.0.1
  flutter_colorpicker: ^1.1.0
  flutter_html_to_pdf:
    path: ./packages/flutter_html_to_pdf
  flutter_local_notifications: ^17.2.1
  flutter_localizations:
    sdk: flutter
  # Kept in (non-dev) dependencies on purpose: Flutter 3.32.0 still emits
  # dev_dependency plugins into GeneratedPluginRegistrant.java, while the AGP 8
  # flutter-plugin-loader strips dev plugin AARs from --release builds -> the
  # registrant references a class that isn't on the release classpath and javac
  # fails (flutter#169336). Listing it as a regular dependency keeps its AAR in
  # release so the generated registrant compiles. Build-time splash config is
  # still under the `flutter_native_splash:` block below.
  flutter_native_splash: ^2.1.0
  flutter_quill:
    path: ./packages/flutter_quill
  flutter_quill_extensions:
    path: ./packages/flutter_quill/flutter_quill_extensions
  flutter_secure_storage: ^9.0.0
  flutter_sound: ^9.30.0
  flutter_svg: ^2.0.9
  flutter_timezone: ^3.0.1
  flutter_tts: ^3.8.3
  flutter_web_auth_2: ^4.0.0
  fluttertoast: ^8.0.9
  get_it: ^7.2.0
  google_fonts: ^4.0.4
  google_sign_in: ^5.3.3
  googleapis: ^15.0.0
  http: ^1.2.2
  in_app_review: ^2.0.4+2
  # See the flutter_native_splash note above: integration_test also ships an
  # Android plugin class that Flutter 3.32.0 writes into the registrant, so it
  # must stay a regular dependency to survive --release dev-dependency stripping.
  integration_test:
    sdk: flutter
  internet_connection_checker: ^0.0.1+4
  intl: ^0.20.2
  local_auth: ^2.1.6
  logger: ^2.0.2
  markdown: ^7.1.1
  package_info_plus: ^4.1.0
  palette_generator: ^0.3.3+4
  path_provider: ^2.0.9
  permission_handler: ^11.0.1
  provider: ^6.0.5
  share_plus: ^7.1.0
  shared_preferences: ^2.0.15
  sqflite: ^2.0.2
  stateless_dropbox_client:
    path: ./packages/stateless_dropbox_client/
  url_launcher: ^6.1.14
  uuid: ^3.0.6
  webdav_client:
    path: ./packages/webdav_client

dev_dependencies:
  bloc_test: ^9.0.3
  build_runner: ^2.1.7
  flutter_launcher_icons: ^0.9.2
  flutter_lints: ^1.0.0
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.14
  mockito: ^5.1.0

# not using this as of now
# flutter_icons:
#   android: 'launcher_icon'
#   ios: true
#   image_path: 'assets/images/test-logo.png'
flutter_native_splash:
  color: "#9e8bd9"
  image: "assets/images/splash_icon_4.webp"
  android_12:
    image: "assets/images/splash_icon_4.webp"
dependency_overrides:
  # For information on the generic Dart part of this file, see the
  # following page: https://dart.dev/tools/pub/pubspec
  # The following section is specific to Flutter.
  analyzer: 8.1.1
  # flutter_localizations (Flutter 3.32 SDK) pins intl 0.20.2, but the local
  # flutter_quill_extensions -> math_keyboard 0.2.1 still requests intl ^0.18.0.
  # math_keyboard only uses intl's stable NumberFormat API, so force 0.20.2.
  intl: ^0.20.2
  # The following transitive deps shipped versions that predate Dart 3 / Flutter
  # 3.x and fail to compile under the Flutter 3.32 SDK. Force forward-compatible
  # releases that keep the same public API their parents rely on:
  #   win32 5.1.1            -> UnmodifiableUint8ListView removed in Dart 3.4
  #   flutter_colorpicker    -> TextTheme.bodyText1/2 removed (now bodyLarge/Medium)
  #   flutter_math_fork      -> hashValues removed; Flutter 3.32 render API changes
  win32: ^5.5.0
  flutter_colorpicker: ^1.1.0
  flutter_math_fork: ^0.7.4
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/fonts/
    - assets/sounds/
    - assets/logo/
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: SF-UI-Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true
